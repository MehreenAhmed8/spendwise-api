spring.application.name=spendwise-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/spendwise}
spring.datasource.username=${DB_USERNAME:spendwise_app}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true